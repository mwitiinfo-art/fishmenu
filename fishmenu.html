<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e5a6b">
<title>Fish Menu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fbf6ea;color:#1b2a35;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:32px 20px 48px}
header{border-bottom:4px solid #0e5a6b;padding-bottom:18px;margin-bottom:8px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(40px,12vw,56px);line-height:1;color:#0e5a6b}
header p{margin:8px 0 0;color:#4a5a66;font-size:17px}
section{margin-top:28px}
h2{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:26px;color:#b84a1a}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{font-size:14px;font-weight:600;text-align:right;padding:8px 0;border-bottom:2px solid #1b2a35;width:84px}
th:first-child{text-align:left;width:auto}
td{padding:13px 0;border-bottom:1px solid #d9cfb8;font-size:18px;text-align:right;font-weight:600}
td:first-child{text-align:left;font-weight:500}
footer{margin-top:32px;color:#4a5a66;font-size:15px}
</style>
</head>
<body>
<main>
  <header>
    <h1>Fish Menu</h1>
    <p>Tilapia &amp; Nile perch, served whole</p>
  </header>

  <section>
    <h2>Whole Tilapia</h2>
    <table>
      <tr><th></th><th>0.6 kg</th><th>1 kg</th></tr>
      <tr><td>Deep fried</td><td>450/-</td><td>800/-</td></tr>
      <tr><td>Wet fried</td><td>600/-</td><td>900/-</td></tr>
      <tr><td>Coconut</td><td>750/-</td><td>1000/-</td></tr>
    </table>
  </section>

  <section>
    <h2>Nile Perch <small style="font-size:15px;color:#4a5a66">(1 kg)</small></h2>
    <table>
      <tr><td>Dry fried</td><td>900/-</td></tr>
      <tr><td>Wet fried</td><td>1050/-</td></tr>
      <tr><td>Coconut</td><td>1200/-</td></tr>
    </table>
  </section>

  <section>
    <h2>Side</h2>
    <table>
      <tr><td>Kienyeji mboga</td><td>100/-</td></tr>
    </table>
  </section>

  <footer>Prices in Kenya shillings.</footer>
</main>
</body>
</html>
